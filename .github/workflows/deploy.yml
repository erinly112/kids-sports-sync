name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'teamsnap-cloud/**'
      - 'teamsnap-rsvp.py'
      - 'sportngin-rsvp.py'
      - 'sportsync_config.py'
      - 'telemetry.py'
      - 'sports-sync-cloud/**'
      - 'sports-cal-sync.py'
      - 'drive-to-games.py'

jobs:
  deploy-teamsnap-rsvp:
    name: Deploy teamsnap-rsvp
    runs-on: ubuntu-latest
    if: |
      contains(github.event.commits[0].modified, 'teamsnap-cloud/') ||
      contains(github.event.commits[0].modified, 'teamsnap-rsvp.py') ||
      contains(github.event.commits[0].modified, 'sportngin-rsvp.py') ||
      contains(github.event.commits[0].modified, 'sportsync_config.py') ||
      contains(github.event.commits[0].modified, 'telemetry.py')
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Copy shared scripts into function directory
        run: |
          cp teamsnap-rsvp.py      teamsnap-cloud/
          cp sportngin-rsvp.py     teamsnap-cloud/
          cp sportsync_config.py   teamsnap-cloud/
          cp telemetry.py          teamsnap-cloud/

      - name: Deploy teamsnap-rsvp
        run: |
          gcloud functions deploy teamsnap-rsvp \
            --project=claude-code-scripts-calendar \
            --region=us-east1 \
            --gen2 \
            --runtime=python311 \
            --source=teamsnap-cloud \
            --entry-point=teamsnap_rsvp \
            --trigger-http \
            --no-allow-unauthenticated \
            --timeout=540s \
            --memory=512MB

  deploy-sports-sync:
    name: Deploy sports-sync
    runs-on: ubuntu-latest
    if: |
      contains(github.event.commits[0].modified, 'sports-sync-cloud/') ||
      contains(github.event.commits[0].modified, 'sports-cal-sync.py') ||
      contains(github.event.commits[0].modified, 'drive-to-games.py') ||
      contains(github.event.commits[0].modified, 'sportsync_config.py') ||
      contains(github.event.commits[0].modified, 'telemetry.py')
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Copy shared scripts into function directory
        run: |
          cp sports-cal-sync.py  sports-sync-cloud/
          cp drive-to-games.py   sports-sync-cloud/
          cp sportsync_config.py sports-sync-cloud/
          cp telemetry.py        sports-sync-cloud/

      - name: Deploy sports-sync
        run: |
          gcloud functions deploy sports-sync \
            --project=claude-code-scripts-calendar \
            --region=us-east1 \
            --gen2 \
            --runtime=python311 \
            --source=sports-sync-cloud \
            --entry-point=sports_sync \
            --trigger-http \
            --no-allow-unauthenticated \
            --timeout=540s \
            --memory=512MB
